# WebTun desktop build config (electron-builder auto-discovers this file —
# no -c flag needed in package.json scripts or CI).
#
# asarUnpack lists only node-pty because it is the only native (N-API)
# dependency shipped in the Electron bundle; every other dependency is pure
# JS and loads fine from inside app.asar. Adding a dependency with a prebuilt
# .node binary means adding an asarUnpack entry for it too, or require()
# fails at runtime. Resolution order for packaged builds lives in
# electron/main.js resolveNodeModules().
appId: com.webtun.app
productName: WebTun
asar: true
files:
  - electron/**/*
  - server.js
  - lib/**/*
  - public/**/*
  - LICENSE
  - package.json
  # Prune node-pty build debris: intermediates (.tlog/.iobj/.ipdb/.exp/.lib,
  # obj/ trees), all-platform prebuilds (runtime uses build/Release, rebuilt
  # for Electron's ABI — see rebuild:electron), test files and sourcemaps.
  # Decision: strip debug intermediates for size; native crashes are diagnosed
  # via crashReporter dumps + webtun-server.log instead. Tens of MB saved.
  - '!node_modules/node-pty/**/obj/**'
  - '!node_modules/node-pty/**/*.iobj'
  - '!node_modules/node-pty/**/*.ipdb'
  - '!node_modules/node-pty/**/*.exp'
  - '!node_modules/node-pty/**/*.lib'
  - '!node_modules/node-pty/**/*.tlog'
  - '!node_modules/node-pty/prebuilds/**'
  - '!**/*.test.js'
  - '!**/*.map'
asarUnpack:
  - node_modules/node-pty/**/*
# Integrity enforcement (see scripts/enforce-asar-integrity.js): after every
# pack, every file inside app.asar is hash-compared against the source tree,
# mismatches (e.g. the v2.2.2 truncations) are repaired from source, and the
# build FAILS on anything unreconciled. Keeps the builder on latest stable
# instead of pinning around its file-copy bug.
afterPack: scripts/enforce-asar-integrity.js
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
  category: Utility
linux:
  target:
    - AppImage
    - deb
  icon: public/icon-512.png
  category: Utility
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Explicit install contract: per-user (no admin prompt), keep user data
  # (logs) on uninstall. Both Setup and portable variants keep shipping.
  perMachine: false
  deleteAppDataOnUninstall: false
