version: 2
updates:
  # npm dependencies (package.json + package-lock.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    versioning-strategy: increase

  # GitHub Actions in .github/workflows (checkout, setup-node, cache, ...)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
