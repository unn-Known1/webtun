name: PR check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Version + lockfile sync
        run: npm run version:check

      - name: Packaging smoke test
        run: npm pack --dry-run

      - name: Server entry loads
        run: node -e "require('./server.js'); console.log('require ok'); process.exit(0)"

      - name: Dependency audit (production only)
        run: npm audit --omit=dev
