name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated: windows,linux,mac)'
        required: false
        default: 'windows,linux,mac'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # Fast guard: never build or publish a tag whose version and lockfile disagree
  # (the checklist asked humans to bump both files; nothing verified it).
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Version + lockfile sync
        run: npm run version:check

      - name: Packaging smoke test
        run: npm pack --dry-run

      - name: Server entry loads
        run: node -e "require('./server.js'); console.log('require ok'); process.exit(0)"

      - name: Dependency audit (production only)
        run: npm audit --omit=dev

  build-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    if: contains(inputs.platforms, 'windows') || github.event_name != 'workflow_dispatch' || inputs.platforms == ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-win-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-win-${{ runner.arch }}-

      - name: Cache electron-builder binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-builder-win-

      - run: npm ci

      - name: Build Windows
        shell: pwsh
        run: |
          $env:ELECTRON_BUILDER_CACHE = "${{ runner.temp }}\electron-builder\Cache"
          for ($i=1; $i -le 5; $i++) {
            npx electron-builder --win --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Attempt $i failed, waiting 15s..."
            Start-Sleep -Seconds 15
          }
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Authenticode signing — removes the Windows "Unknown
          # publisher" warning. Absent/empty = build proceeds unsigned.
          # Setup: base64-encoded .pfx in WIN_CSC_LINK + its password in
          # WIN_CSC_KEY_PASSWORD (repo Settings → Secrets → Actions).
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: webtun-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: contains(inputs.platforms, 'linux') || github.event_name != 'workflow_dispatch' || inputs.platforms == ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Cache Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/electron
          key: electron-linux-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-linux-${{ runner.arch }}-

      - run: npm ci

      - name: Build Linux
        run: |
          for i in 1 2 3 4 5; do
            npx electron-builder --linux --publish never && exit 0
            echo "Attempt $i failed, waiting 15s..."
            sleep 15
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: webtun-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 30

  build-mac:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 45
    if: contains(inputs.platforms, 'mac') || github.event_name != 'workflow_dispatch' || inputs.platforms == ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/Library/Caches/electron
          key: electron-mac-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-mac-${{ runner.arch }}-

      - run: npm ci

      - name: Build macOS
        run: |
          for i in 1 2 3 4 5; do
            npx electron-builder --mac --publish never && exit 0
            echo "Attempt $i failed, waiting 15s..."
            sleep 15
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: webtun-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [build-windows, build-linux, build-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: webtun-*
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            *.exe
            *.AppImage
            *.deb
            *.dmg
            *.zip
          fail_on_unmatched_files: true
