name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated: windows,linux,mac)'
        required: false
        default: 'windows,linux,mac'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # Fast guard: never build or publish a tag whose version and lockfile disagree
  # (the checklist asked humans to bump both files; nothing verified it).
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      - name: Version + lockfile sync
        run: npm run version:check

      - name: Packaging smoke test
        run: npm pack --dry-run

      - name: Server entry loads
        run: node -e "require('./server.js'); console.log('require ok'); process.exit(0)"

      - name: Dependency audit (production only)
        run: npm audit --omit=dev

      - name: Rebuild native modules for Electron ABI
        run: npm run rebuild:electron

      - name: Assert unpacked native binding present
        run: test -f node_modules/node-pty/build/Release/pty.node

      # Catches the v2.2.2 asar-truncation class before any platform builds:
      # stage the Linux bundle and run the integrity gate + tree manifest.
      - name: Pack staged bundle (no distribution)
        run: npm run pack -- --linux

      - name: asar integrity gate
        run: node scripts/ci-gate.js dist/linux-unpacked --manifest-out dist/packed-tree-manifest.json

  build-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    if: contains(inputs.platforms, 'windows') || github.event_name != 'workflow_dispatch' || inputs.platforms == ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-win-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-win-${{ runner.arch }}-

      - name: Cache electron-builder binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-builder-win-

      - run: npm ci

      - name: Rebuild native modules for Electron ABI
        run: npm run rebuild:electron

      - name: Assert unpacked native binding present
        shell: pwsh
        run: |
          if (-not (Test-Path node_modules/node-pty/build/Release/pty.node)) { throw 'pty.node missing after rebuild' }

      - name: Build Windows
        shell: pwsh
        run: |
          $env:ELECTRON_BUILDER_CACHE = "${{ runner.temp }}\electron-builder\Cache"
          for ($i=1; $i -le 5; $i++) {
            npx electron-builder --win --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Attempt $i failed, waiting 15s..."
            Start-Sleep -Seconds 15
          }
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Authenticode signing — removes the Windows "Unknown
          # publisher" warning. Absent/empty = build proceeds unsigned.
          # Setup: base64-encoded .pfx in WIN_CSC_LINK + its password in
          # WIN_CSC_KEY_PASSWORD (repo Settings → Secrets → Actions).
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Independent of the in-build afterPack enforcer: stage once more and
      # run the integrity gate + tree manifest over the Windows output.
      - name: Stage + gate Windows bundle
        shell: pwsh
        run: |
          npx electron-builder --win --dir --publish never
          node scripts/ci-gate.js dist/win-unpacked --manifest-out dist/packed-tree-manifest-windows.json
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Size budget (fail on unexpected bloat)
        shell: pwsh
        run: |
          $caps = @{ '.exe' = 170MB }
          Get-ChildItem dist/*.exe | ForEach-Object {
            $cap = $caps['.exe']
            Write-Host "$($_.Name): $([math]::Round($_.Length/1MB,1)) MB (cap $([math]::Round($cap/1MB)) MB)"
            if ($_.Length -gt $cap) { throw "$($_.Name) exceeds size budget" }
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: webtun-windows
          path: |
            dist/*.exe
            dist/packed-tree-manifest-windows.json
          if-no-files-found: error
          retention-days: 30

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: contains(inputs.platforms, 'linux') || github.event_name != 'workflow_dispatch' || inputs.platforms == ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Cache Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/electron
          key: electron-linux-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-linux-${{ runner.arch }}-

      - run: npm ci

      - name: Rebuild native modules for Electron ABI
        run: npm run rebuild:electron

      - name: Assert unpacked native binding present
        run: test -f node_modules/node-pty/build/Release/pty.node

      - name: Build Linux
        run: |
          for i in 1 2 3 4 5; do
            npx electron-builder --linux --publish never && exit 0
            echo "Attempt $i failed, waiting 15s..."
            sleep 15
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Independent of the in-build afterPack enforcer: stage once more and
      # run the integrity gate + tree manifest over the Linux output.
      - name: Stage + gate Linux bundle
        run: |
          npx electron-builder --linux --dir --publish never
          node scripts/ci-gate.js dist/linux-unpacked --manifest-out dist/packed-tree-manifest-linux.json

      - name: Size budget (fail on unexpected bloat)
        run: |
          check() { # $1 = glob, $2 = cap in MB
            for f in $1; do
              size=$(stat -c%s "$f"); cap=$(( $2 * 1024 * 1024 ))
              echo "$f: $(( size / 1024 / 1024 )) MB (cap $2 MB)"
              if [ "$size" -gt "$cap" ]; then echo "$f exceeds size budget"; exit 1; fi
            done
          }
          check 'dist/*.deb' 130
          check 'dist/*.AppImage' 160

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: webtun-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/packed-tree-manifest-linux.json
          if-no-files-found: error
          retention-days: 30

  build-mac:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 45
    if: contains(inputs.platforms, 'mac') || github.event_name != 'workflow_dispatch' || inputs.platforms == ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/Library/Caches/electron
          key: electron-mac-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-mac-${{ runner.arch }}-

      - run: npm ci

      - name: Rebuild native modules for Electron ABI
        run: npm run rebuild:electron

      - name: Assert unpacked native binding present
        run: test -f node_modules/node-pty/build/Release/pty.node

      - name: Build macOS
        run: |
          for i in 1 2 3 4 5; do
            npx electron-builder --mac --publish never && exit 0
            echo "Attempt $i failed, waiting 15s..."
            sleep 15
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Independent of the in-build afterPack enforcer: stage once more and
      # run the integrity gate + tree manifest over the macOS output.
      # (No headless boot smoke on macOS runners — integrity gate only.)
      # NOTE: --dir output is arch-suffixed (dist/mac-arm64 on Apple Silicon,
      # dist/mac-x64 on Intel, dist/mac otherwise) — resolve it dynamically.
      - name: Stage + gate macOS bundle
        run: |
          npx electron-builder --mac --dir --publish never
          STAGED=""; for d in dist/mac-arm64 dist/mac-x64 dist/mac; do if [ -d "$d" ]; then STAGED="$d"; fi; done
          [ -n "$STAGED" ] || { echo "no mac stage dir under dist/"; exit 1; }
          node scripts/ci-gate.js "$STAGED" --manifest-out dist/packed-tree-manifest-mac.json

      - name: Size budget (fail on unexpected bloat)
        run: |
          check() { # $1 = glob, $2 = cap in MB
            for f in $1; do
              size=$(stat -f%z "$f"); cap=$(( $2 * 1024 * 1024 ))
              echo "$f: $(( size / 1024 / 1024 )) MB (cap $2 MB)"
              if [ "$size" -gt "$cap" ]; then echo "$f exceeds size budget"; exit 1; fi
            done
          }
          check 'dist/*.dmg' 165
          check 'dist/*.zip' 160

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: webtun-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/packed-tree-manifest-mac.json
          if-no-files-found: error
          retention-days: 30

  # Boot smoke tests on the real installable artifacts (not the staged dir):
  # install → launch → poll the auth/required endpoint. macOS has no headless
  # boot smoke (integrity gate covers it); Windows/Linux boot headless.
  smoke-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: contains(inputs.platforms, 'linux') || github.event_name != 'workflow_dispatch' || inputs.platforms == ''
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: webtun-linux
          path: artifacts

      - name: Install deb on clean runner
        run: |
          sudo apt-get update
          sudo apt-get install -y ./artifacts/webtun_*.deb xvfb

      - name: Boot installed app + probe API
        run: |
          export PORT=39517 TMPDIR=/tmp
          xvfb-run -a /opt/WebTun/webtun --no-sandbox > /tmp/webtun-smoke.log 2>&1 &
          for i in $(seq 1 60); do
            out=$(curl -s -m 3 http://127.0.0.1:39517/api/auth/required || true)
            if [ "$out" = '{"required":false}' ]; then echo "boot ok: $out"; pkill -f "[o]pt/WebTun/webtun" || true; exit 0; fi
            sleep 5
          done
          echo "smoke failed: API never answered"; tail -30 /tmp/webtun-smoke.log; exit 1

  smoke-windows:
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 15
    if: contains(inputs.platforms, 'windows') || github.event_name != 'workflow_dispatch' || inputs.platforms == ''
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: webtun-windows
          path: artifacts

      - name: Boot portable app + probe API
        shell: pwsh
        run: |
          $exe = Get-ChildItem artifacts/*.exe | Where-Object { $_.Name -notlike '*Setup*' } | Select-Object -First 1
          if (-not $exe) { throw 'portable exe not found in artifacts' }
          $env:PORT = '39517'
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList '--no-sandbox' -PassThru
          try {
            for ($i=0; $i -lt 60; $i++) {
              try { $out = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 'http://127.0.0.1:39517/api/auth/required').Content } catch { $out = '' }
              if ($out -eq '{"required":false}') { Write-Host "boot ok: $out"; exit 0 }
              Start-Sleep -Seconds 5
            }
            throw 'smoke failed: API never answered'
          } finally { try { Stop-Process -Id $proc.Id -Force } catch {} }

  release:
    needs: [build-windows, build-linux, build-mac, smoke-linux, smoke-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: webtun-*
          merge-multiple: true

      - name: Checksums for every asset
        run: |
          sha256sum *.exe *.AppImage *.deb *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest the checksums file (covers all assets by hash)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: SHA256SUMS.txt

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      - name: SBOM (SPDX, production only)
        run: npm sbom --omit=dev --sbom-format spdx > "webtun-${GITHUB_REF_NAME}.spdx.json"

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            *.exe
            *.AppImage
            *.deb
            *.dmg
            *.zip
            SHA256SUMS.txt
            *.spdx.json
          fail_on_unmatched_files: true
