name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated: windows,linux,mac)'
        required: false
        default: 'windows,linux,mac'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    if: contains(inputs.platforms, 'windows') || github.event_name != 'workflow_dispatch' || inputs.platforms == ''
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-win-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-win-${{ runner.arch }}-

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-builder-win-

      - name: Build Windows
        shell: pwsh
        run: |
          $env:ELECTRON_BUILDER_CACHE = "${{ runner.temp }}\electron-builder\Cache"
          for ($i=1; $i -le 5; $i++) {
            npx electron-builder --win --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Attempt $i failed, waiting 15s..."
            Start-Sleep -Seconds 15
          }
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: webtun-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    if: contains(inputs.platforms, 'linux') || github.event_name != 'workflow_dispatch' || inputs.platforms == ''
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-linux-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-linux-${{ runner.arch }}-

      - run: npm ci

      - name: Build Linux
        run: |
          for i in 1 2 3 4 5; do
            npx electron-builder --linux --publish never && exit 0
            echo "Attempt $i failed, waiting 15s..."
            sleep 15
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: webtun-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 30

  build-mac:
    runs-on: macos-latest
    if: contains(inputs.platforms, 'mac') || github.event_name != 'workflow_dispatch' || inputs.platforms == ''
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-mac-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-mac-${{ runner.arch }}-

      - run: npm ci

      - name: Build macOS
        run: |
          for i in 1 2 3 4 5; do
            npx electron-builder --mac --publish never && exit 0
            echo "Attempt $i failed, waiting 15s..."
            sleep 15
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: webtun-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [build-windows, build-linux, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: webtun-*
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ./*
          fail_on_unmatched_files: false
